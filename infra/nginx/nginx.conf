# F6-2 / ADR-0019: templat situs nginx di HOST elcodelabs (bukan service compose).
# Pola server (SERVER_PLAYBOOK): satu situs per app dengan server_name sendiri, proxy ke
# 127.0.0.1:<port app>, TLS ditambahkan `certbot --nginx` (auto-renew).
#
# Pasang:
#   sudo cp infra/nginx/nginx.conf /etc/nginx/sites-available/minierp   # ganti <domain>
#   sudo ln -s /etc/nginx/sites-available/minierp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <domain>        # menambah listen 443 + sertifikat + redirect 80->443
#
# JANGAN tambahkan `default_server`: hanya boleh satu per :80 dan dipegang elkasir
# (`nginx -t` gagal "duplicate default_server").
#
# Container terlihat dari IP bridge docker (172.16.0.0/12), bukan 127.0.0.1: TRUSTED_PROXIES di
# .env produksi harus mencakupnya agar X-Forwarded-For dipercaya (F1-3) — tanpa itu semua
# pengguna tampak satu IP dan pembatas login (10/menit per IP) menolak mereka bersamaan.

server {
  listen 80;
  server_name <domain>;

  # Upload 5 MB + overhead multipart; ekspor adalah GET.
  client_max_body_size 6m;

  # Aplikasi sudah mengompres sendiri (server/compress.go); jangan ganda.
  gzip off;

  location / {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_request_buffering on;
  }

  # Metrics hanya untuk loopback; token tetap wajib (METRICS_TOKEN, F6-5).
  location = /api/v1/metrics {
    deny all;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options DENY always;
  # HSTS baru aman setelah certbot memasang TLS; certbot tidak menambahkannya sendiri.
  # add_header Strict-Transport-Security "max-age=31536000" always;
}
