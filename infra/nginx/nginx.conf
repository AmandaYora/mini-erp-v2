# F6-2: templat reverse proxy di HOST (bukan service compose). Standar: satu
# container app; TLS terminasi di host (certbot/Let's Encrypt). Salin ke
# /etc/nginx/sites-available/mini-erp, ganti <domain> dan path sertifikat,
# lalu `nginx -t && systemctl reload nginx`.
#
# Asumsi: app hanya listen di 127.0.0.1:8080 (lihat docker-compose.yml).
# TRUSTED_PROXIES di .env produksi harus mencakup IP proxy ini
# (contoh: 127.0.0.1/32) agar X-Forwarded-For dipercaya (F1-3).

server {
  listen 80;
  server_name <domain>;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name <domain>;

  ssl_certificate /etc/letsencrypt/live/<domain>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Upload 5 MB + overhead multipart; ekspor adalah GET.
  client_max_body_size 6m;

  # Aplikasi sudah mengompres sendiri (server/compress.go); jangan ganda.
  gzip off;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_request_buffering on;
  }

  # Metrics hanya untuk loopback; token tetap wajib (METRICS_TOKEN, F6-5).
  location = /api/v1/metrics {
    deny all;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options DENY always;
}
