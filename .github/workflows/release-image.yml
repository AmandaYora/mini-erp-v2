# Build & push image aplikasi ke GHCR (ADR-0019, SERVER_PLAYBOOK elcodelabs: "build in CI, run here").
# VPS tidak pernah membangun image; ia hanya menarik ghcr.io/amandayora/mini-erp-v2:<git-sha>.
#
# Berjalan HANYA setelah workflow `ci` lulus untuk push ke main, pada commit yang sama persis
# (head_sha), sehingga image yang terbit selalu image yang testnya hijau. Bisa juga dipicu manual
# (workflow_dispatch) untuk satu ref tertentu.
name: release-image

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref/commit yang dibangun (default: main)"
        required: false
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      - name: tentukan nama & tag image
        id: meta
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          sha="$(git rev-parse HEAD)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Image: ${image}:${sha}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push (linux/amd64 — arsitektur VPS)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ringkasan
        run: |
          {
            echo "### Image terbit"
            echo ""
            echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}\`"
            echo ""
            echo "Deploy di VPS elcodelabs: \`cd ~/minierp && ./deploy.sh ${{ steps.meta.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
