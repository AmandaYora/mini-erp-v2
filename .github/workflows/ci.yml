name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: mini_erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -pci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Database name must end in _test and the host must be local: the
      # integration harness refuses anything else (internal/testutil/dsnguard).
      TEST_DB_DSN: root:ci@tcp(127.0.0.1:3306)/mini_erp_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "belum di-gofmt:"; echo "$unformatted"; exit 1; fi
      - name: test (termasuk integrasi MySQL)
        run: go test -count=1 -timeout=40m ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tsc
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: lint
        run: npm run lint
        working-directory: apps/web
      - name: vitest
        run: npm run test
        working-directory: apps/web
      - name: build
        run: npm run build:web

  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/arch-check.mjs
      - run: node scripts/contract-check.mjs
